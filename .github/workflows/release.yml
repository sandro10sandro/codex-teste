name: Release APK

# Publica o APK debug como GitHub Release (pré-lançamento) ao empurrar uma tag v*.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner ubuntu-latest já traz o Android SDK em $ANDROID_HOME; só garantimos os pacotes.
      - name: Install SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          NAME="CallLab-${GITHUB_REF_NAME}-debug.apk"
          cp "$APK" "$NAME"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          cat > notes.md <<NOTES
          APK **debug** do CallLab (gravador de chamadas de laboratório), gerado pelo CI a partir do commit \`${GITHUB_SHA}\`.

          - Assinado com a chave de debug: serve para aparelhos de laboratório, não para distribuição.
          - **Ative o serviço de acessibilidade "CallLab"** após instalar: sem ele o Android entrega silêncio ao microfone durante chamadas.
          - Ainda não validado em aparelho físico. Veja \`android/README.md\` para o roteiro de teste e os limites.

          SHA-256 do APK: \`${SHA}\`
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" "$NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CallLab ${GITHUB_REF_NAME} (debug)" \
            --notes-file notes.md \
            --prerelease \
            --verify-tag
